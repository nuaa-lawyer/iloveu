<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谢谢你看完啦</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       收尾页：end.html CSS
       配色延续暖奶白 + 浅粉浅紫，低饱和柔和，像素风统一
       ================================================================ */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FFF8F6;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      animation: pageFadeIn 1.2s ease;
      transition: opacity 0.6s ease;
    }

    body.fade-out { opacity: 0; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 浮动方块背景画布 ===== */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ===== 像素烟花画布 ===== */
    #fireworkCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ===== 主内容层 ===== */
    .end-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .end-text {
      font-family: 'Press Start 2P', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: clamp(14px, 3vw, 22px);
      color: #5D4E5F;
      letter-spacing: 3px;
      line-height: 2;
      /* 像素风格轻微阴影，与全站低饱和温柔色系统一 */
      text-shadow:
        1px 1px 0 rgba(200,184,212,0.35),
        -1px -1px 0 rgba(255,248,246,0.25);
      image-rendering: pixelated;
      animation: textBreath 3s ease-in-out infinite;
    }

    @keyframes textBreath {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      .end-text { font-size: 12px; letter-spacing: 1px; }
      .end-content { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- 浮动方块背景 -->
  <canvas id="bgCanvas"></canvas>

  <!-- 像素烟花 -->
  <canvas id="fireworkCanvas"></canvas>

  <!-- 主内容 -->
  <div class="end-content">
    <p class="end-text">谢谢你看完啦，快乐~</p>
  </div>

  <script>
    (function () {
      /* ================================================================
         收尾页：end.html JS
         功能：
           1. 像素方块流动背景
           2. 温柔像素烟花飘落动画
           3. 背景音乐无缝接续播放
         ================================================================ */

      // ==================== 背景音乐（本地MP3） ====================
      var bgmAudio = null;

      function initBgm() {
        if (bgmAudio) return;
        bgmAudio = new Audio('/music/bgm.mp3');
        bgmAudio.loop = true;
        bgmAudio.volume = 0.35;

        var savedTime = parseFloat(sessionStorage.getItem('px_bgm_time')) || 0;
        var wasUnlocked = sessionStorage.getItem('px_bgm_unlocked') === '1';

        var seekDone = false;
        bgmAudio.addEventListener('loadedmetadata', function () {
          if (!seekDone && savedTime > 0 && savedTime < bgmAudio.duration) {
            bgmAudio.currentTime = savedTime;
            seekDone = true;
          }
        });
        bgmAudio.addEventListener('canplay', function () {
          if (!seekDone && savedTime > 0 && savedTime < bgmAudio.duration) {
            bgmAudio.currentTime = savedTime;
            seekDone = true;
          }
        });

        setInterval(function () {
          if (bgmAudio && !bgmAudio.paused) {
            sessionStorage.setItem('px_bgm_time', bgmAudio.currentTime);
            sessionStorage.setItem('px_bgm_playing', '1');
          }
        }, 1000);

        window.addEventListener('beforeunload', function () {
          if (bgmAudio && !bgmAudio.paused) {
            sessionStorage.setItem('px_bgm_time', bgmAudio.currentTime);
            sessionStorage.setItem('px_bgm_playing', '1');
          }
        });

        return wasUnlocked;
      }

      function playBgm() {
        if (bgmAudio && bgmAudio.paused) {
          bgmAudio.play().catch(function () {});
        }
      }

      // ==================== 浮动方块背景 ====================
      var bgCanvas = document.getElementById('bgCanvas');
      var bgCtx = bgCanvas.getContext('2d');

      var squareColors = [
        'rgba(255,209,220,0.22)',
        'rgba(232,213,224,0.22)',
        'rgba(212,229,247,0.20)',
        'rgba(212,237,218,0.20)',
        'rgba(255,245,238,0.25)',
        'rgba(200,184,212,0.20)',
        'rgba(245,215,210,0.22)',
      ];

      var squares = [];
      var SQUARE_COUNT = 38;

      function initSquares() {
        squares = [];
        for (var i = 0; i < SQUARE_COUNT; i++) {
          squares.push({
            x: Math.random() * (bgCanvas.width || window.innerWidth),
            y: Math.random() * (bgCanvas.height || window.innerHeight),
            size: 6 + Math.random() * 10,
            speed: 0.10 + Math.random() * 0.30,
            color: squareColors[Math.floor(Math.random() * squareColors.length)],
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.003 + Math.random() * 0.005,
            wobbleAmp: 0.3 + Math.random() * 0.7,
          });
        }
      }

      function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      }

      function drawBgFrame() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        squares.forEach(function (sq) {
          sq.y -= sq.speed;
          sq.wobble += sq.wobbleSpeed;
          var driftX = Math.sin(sq.wobble) * sq.wobbleAmp;
          var drawX = sq.x + driftX;
          if (sq.y < -sq.size) {
            sq.y = bgCanvas.height + sq.size;
            sq.x = Math.random() * bgCanvas.width;
          }
          bgCtx.fillStyle = sq.color;
          bgCtx.fillRect(Math.floor(drawX), Math.floor(sq.y), Math.floor(sq.size), Math.floor(sq.size));
        });
        requestAnimationFrame(drawBgFrame);
      }

      // ==================== 像素烟花动画 ====================
      var fwCanvas = document.getElementById('fireworkCanvas');
      var fwCtx = fwCanvas.getContext('2d');

      var fireworkColors = [
        '#E8A0B4', '#D4A5B9', '#C9B8D4', '#B8A9C9',
        '#F0D0DC', '#E8D5E0', '#DEBFD0', '#DDB8C9',
      ];

      var particles = [];
      var GRAVITY = 0.025;

      function resizeFwCanvas() {
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;
      }

      function createFirework() {
        var cx = fwCanvas.width * 0.15 + Math.random() * fwCanvas.width * 0.7;
        var cy = fwCanvas.height * 0.25 + Math.random() * fwCanvas.height * 0.4;
        var color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
        // 略减少粒子数，更柔和
        var count = 18 + Math.floor(Math.random() * 12);

        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          var speed = 0.6 + Math.random() * 2.0;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 2 + Math.random() * 3,
            color: color,
            life: 1,
            decay: 0.006 + Math.random() * 0.010,
          });
        }
      }

      function drawFireworks() {
        fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += GRAVITY;
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          // 透明度降低，效果更柔和不浮夸
          fwCtx.globalAlpha = p.life * 0.45;
          fwCtx.fillStyle = p.color;
          fwCtx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.size), Math.floor(p.size));
        }

        fwCtx.globalAlpha = 1;
        requestAnimationFrame(drawFireworks);
      }

      function launchFireworks() {
        // 同时 2~3 束烟花在不同位置陆续绽开
        var burstCount = 2 + Math.floor(Math.random() * 2);
        for (var i = 0; i < burstCount; i++) {
          setTimeout(function () {
            createFirework();
          }, i * 80 + Math.random() * 180);
        }
        // 下一轮间隔缩短，频率更高
        var delay = 600 + Math.random() * 1400;
        setTimeout(launchFireworks, delay);
      }

      // ==================== 初始化 ====================
      function init() {
        var wasUnlocked = initBgm();
        if (wasUnlocked) {
          playBgm();
        }

        resizeBgCanvas();
        initSquares();
        drawBgFrame();

        resizeFwCanvas();
        drawFireworks();
        // 烟花更快启动：第一组 600ms 后开始
        setTimeout(launchFireworks, 600);

        window.addEventListener('resize', function () {
          resizeBgCanvas();
          resizeFwCanvas();
          initSquares();
        });

        // 首次交互续播 BGM（自动播放被阻止时的兜底）
        document.addEventListener('click', function resumeBgm() {
          if (bgmAudio && bgmAudio.paused) {
            bgmAudio.play().catch(function () {});
          }
        }, { once: true });
        document.addEventListener('touchstart', function resumeBgmTouch() {
          if (bgmAudio && bgmAudio.paused) {
            bgmAudio.play().catch(function () {});
          }
        }, { once: true });
      }

      init();
    })();
  </script>
</body>
</html>
