<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心里话信箱</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       第三页：message.html 心里话信箱页 CSS
       配色延续暖奶白 + 浅粉浅紫，低饱和柔和
       ================================================================ */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FFF8F6;
      min-height: 100vh;
      font-family: 'VT323', 'Courier New', monospace;
      /* 页面淡入 */
      animation: pageFadeIn 0.8s ease;
      transition: opacity 0.6s ease;
    }

    body.fade-out { opacity: 0; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 背景画布（降低透明度版本） ===== */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5; /* 降低透明度，不遮挡文字 */
    }

    /* ===== 主内容层 ===== */
    .page-content {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ===== 区块标题 ===== */
    .section-title {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: clamp(12px, 2vw, 16px);
      color: #5D4E5F;
      letter-spacing: 3px;
      margin-bottom: 1.5rem;
      text-align: center;
      /* 像素风下划线 */
      position: relative;
      padding-bottom: 1rem;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: #D4A5B9;
      /* 像素锯齿 */
      box-shadow:
        5px 0 0 #D4A5B9,
        -5px 0 0 #D4A5B9;
    }

    /* ===== To you 区域 ===== */
    .toyou-section {
      background: rgba(255,248,246,0.85);
      border: 2px solid #E8D5E0;
      padding: 1.8rem;
      margin-bottom: 2.5rem;
      /* 像素风外框 */
      box-shadow:
        0 0 0 2px #FFF8F6,
        0 0 0 5px rgba(200,184,212,0.4),
        0 4px 16px rgba(180,160,180,0.1);
    }

    /* ★★★ To you 文案在此编辑 ★★★
       修改下方 .toyou-content 内的内容即可
       支持 <br> 换行，支持 <p> 段落
       查看 README.md 获取详细修改说明 */
    .toyou-content {
      font-family: 'VT323', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: clamp(15px, 2.5vw, 19px);
      color: #5D4E5F;
      line-height: 1.9;
      letter-spacing: 1px;
      min-height: 3em;
      word-break: break-word;
    }

    /* ===== From you 区域 ===== */
    .fromyou-section {
      background: rgba(255,248,246,0.85);
      border: 2px solid #E8D5E0;
      padding: 1.8rem;
      margin-bottom: 2.5rem;
      box-shadow:
        0 0 0 2px #FFF8F6,
        0 0 0 5px rgba(200,184,212,0.4),
        0 4px 16px rgba(180,160,180,0.1);
    }

    /* 输入框容器 */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    /* 像素风输入框 */
    .msg-input {
      flex: 1;
      min-width: 200px;
      font-family: 'VT323', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: clamp(14px, 2vw, 18px);
      color: #5D4E5F;
      background: #FFFAF8;
      border: 2px solid #D4C5D9;
      padding: 12px 16px;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s ease;
    }
    .msg-input:focus {
      border-color: #B8A9C9;
    }
    .msg-input::placeholder {
      color: #C9B8D4;
      font-style: italic;
    }

    /* 像素风发送按钮 */
    .btn-send {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: clamp(9px, 1.5vw, 12px);
      color: #FFF8F6;
      background: #B8A9C9;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      letter-spacing: 2px;
      white-space: nowrap;
      box-shadow:
        0 0 0 3px #FFF8F6,
        0 0 0 6px #B8A9C9,
        0 5px 0 #9B8BAA;
      position: relative;
      top: 0;
      transition: all 0.12s ease;
    }
    .btn-send:hover {
      background: #C9B8D4;
      box-shadow:
        0 0 0 3px #FFF8F6,
        0 0 0 6px #C9B8D4,
        0 3px 0 #A894B5;
      top: 2px;
    }
    .btn-send:active {
      top: 5px;
      box-shadow:
        0 0 0 3px #FFF8F6,
        0 0 0 6px #B8A9C9,
        0 0 0 #9B8BAA;
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 发送状态提示 */
    .send-status {
      font-family: 'VT323', 'Microsoft YaHei', monospace;
      font-size: 13px;
      text-align: center;
      min-height: 1.5em;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }
    .send-status.success { color: #7BA88A; }
    .send-status.error   { color: #C98B8B; }

    /* ===== 留言墙 ===== */
    .message-wall {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 留言卡片 */
    .msg-card {
      background: rgba(255,250,248,0.9);
      border: 1px solid #E8D5E0;
      padding: 1rem 1.2rem;
      box-shadow: 0 2px 8px rgba(180,160,180,0.08);
      word-break: break-word;
    }
    .msg-card .msg-time {
      font-family: 'VT323', monospace;
      font-size: 11px;
      color: #C9B8D4;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    .msg-card .msg-body {
      font-family: 'VT323', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: clamp(14px, 2vw, 17px);
      color: #5D4E5F;
      line-height: 1.6;
    }

    /* 无留言提示 */
    .msg-empty {
      text-align: center;
      color: #C9B8D4;
      font-size: 14px;
      padding: 2rem 0;
      letter-spacing: 2px;
    }

    /* 加载中 */
    .msg-loading {
      text-align: center;
      color: #C9B8D4;
      font-size: 13px;
      padding: 1rem 0;
      animation: textBreath 1.5s ease-in-out infinite;
    }

    @keyframes textBreath {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.8; }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      .page-content { padding: 1.5rem 1rem 3rem; }
      .toyou-section, .fromyou-section { padding: 1.2rem; }
      .input-group { flex-direction: column; }
      .btn-send { width: 100%; text-align: center; }
      .section-title { font-size: 11px; letter-spacing: 2px; }
    }
  </style>
</head>
<body>

  <!-- 背景画布（流动像素方块，低透明度） -->
  <canvas id="bgCanvas"></canvas>

  <!-- 主内容 -->
  <div class="page-content">

    <!-- ==================== To you 区域 ==================== -->
    <div class="toyou-section">
      <h2 class="section-title">To you</h2>

      <!--
        ★★★ To you 文案在此编辑 ★★★
        在下方 <div class="toyou-content"> 和 </div> 之间
        粘贴你想对他/她说的话，支持 HTML 标签换行如 <br>
        示例：
        <p>遇见你之后，我才发现……</p>
        <p>原来世界可以这么温柔。</p>

        本区域固定展示，不可在页面上编辑输入。
        详细修改说明见 README.md
      -->
      <div class="toyou-content">
        <!-- 👇 在此处下方粘贴你的心里话 👇 -->
        <p>嘿嘿真好玩</p>
        <p>希望你看到的时候，也会偷偷笑一下~</p>


        <!-- 👆 在此处上方粘贴你的心里话 👆 -->
      </div>
    </div>

    <!-- ==================== From you 区域 ==================== -->
    <div class="fromyou-section">
      <h2 class="section-title">From you</h2>

      <!-- 输入组 -->
      <div class="input-group">
        <input
          type="text"
          class="msg-input"
          id="msgInput"
          placeholder="写下你想对我说的话…"
          maxlength="500"
          autocomplete="off"
        >
        <button class="btn-send" id="btnSend">send</button>
      </div>

      <!-- 发送状态 -->
      <div class="send-status" id="sendStatus"></div>

      <!-- 留言墙 -->
      <div class="message-wall" id="messageWall">
        <div class="msg-loading">loading messages...</div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      /* ================================================================
         第三页：message.html 心里话信箱 JS
         功能：
           1. 延续流动像素方块背景（低透明度）
           2. 继续播放同一首纯代码合成背景音乐
           3. 留言提交/读取对接 Cloudflare Pages Functions
           4. 留言墙展示（时间倒序）
           5. 发送成功提示音效
         ================================================================ */

      // ★★★ 部署后修改为你的 Cloudflare Pages 域名 ★★★
      // 例如：const API_BASE_URL = "https://pixel-confession.pages.dev";
      var API_BASE_URL = "https://iloveu-7er.pages.dev/";

      // ==================== DOM 元素 ====================
      var bgCanvas     = document.getElementById('bgCanvas');
      var bgCtx        = bgCanvas.getContext('2d');
      var msgInput     = document.getElementById('msgInput');
      var btnSend      = document.getElementById('btnSend');
      var sendStatus   = document.getElementById('sendStatus');
      var messageWall  = document.getElementById('messageWall');

      // ==================== 全局状态 ====================
      var audioCtx     = null;
      var musicCtx     = null;
      var musicNoteIdx = 0;
      var musicTimer   = null;
      var musicStarted = false;
      var isSending    = false; // 防重复提交

      // ==================== 音频工具函数 ====================

      function getAudioCtx() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      /**
       * 播放发送成功提示音效（双音阶上行）
       */
      function playSuccessSound() {
        try {
          var ctx = getAudioCtx();
          var now = ctx.currentTime;
          var notes = [523.25, 659.25]; // C5 → E5 上行

          notes.forEach(function (freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            var start = now + i * 0.12;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.06, start + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.25);
          });
        } catch (e) {}
      }

      /**
       * 播放按钮悬浮音效
       */
      function playHoverSound() {
        try {
          var ctx = getAudioCtx();
          var now = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch (e) {}
      }

      /**
       * 播放按钮点击音效
       */
      function playClickSound() {
        try {
          var ctx = getAudioCtx();
          var now = ctx.currentTime;
          [660, 880].forEach(function (freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            var start = now + i * 0.04;
            gain.gain.setValueAtTime(0.05, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.1);
          });
        } catch (e) {}
      }

      // ==================== 背景音乐（与 main.html 同一旋律） ====================

      var melodySequence = [
        { freq: 329.63, harm: 261.63, dur: 2.0 },
        { freq: 392.00, harm: 329.63, dur: 2.0 },
        { freq: 440.00, harm: 349.23, dur: 2.0 },
        { freq: 523.25, harm: 440.00, dur: 2.0 },
        { freq: 440.00, harm: 349.23, dur: 2.0 },
        { freq: 392.00, harm: 329.63, dur: 2.0 },
        { freq: 329.63, harm: 261.63, dur: 2.0 },
        { freq: 293.66, harm: 220.00, dur: 2.0 },
        { freq: 261.63, harm: 220.00, dur: 2.0 },
        { freq: 293.66, harm: 233.08, dur: 2.0 },
        { freq: 329.63, harm: 261.63, dur: 2.0 },
        { freq: 392.00, harm: 329.63, dur: 2.0 },
        { freq: 440.00, harm: 349.23, dur: 2.0 },
        { freq: 392.00, harm: 329.63, dur: 2.0 },
        { freq: 329.63, harm: 261.63, dur: 2.0 },
        { freq: 293.66, harm: 220.00, dur: 2.0 },
        { freq: 261.63, harm: 196.00, dur: 3.0 },
      ];

      function playMusicNote(freq, harmFreq, startTime, duration) {
        if (!musicCtx) return;
        var attack = 0.15, release = 0.25;
        // 主旋律
        var osc1 = musicCtx.createOscillator();
        var gain1 = musicCtx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.value = freq;
        gain1.gain.setValueAtTime(0, startTime);
        gain1.gain.linearRampToValueAtTime(0.07, startTime + attack);
        gain1.gain.setValueAtTime(0.07, startTime + duration - release);
        gain1.gain.linearRampToValueAtTime(0, startTime + duration);
        osc1.connect(gain1);
        gain1.connect(musicCtx.destination);
        osc1.start(startTime);
        osc1.stop(startTime + duration);
        // 和声
        var osc2 = musicCtx.createOscillator();
        var gain2 = musicCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.value = harmFreq;
        gain2.gain.setValueAtTime(0, startTime);
        gain2.gain.linearRampToValueAtTime(0.035, startTime + attack);
        gain2.gain.setValueAtTime(0.035, startTime + duration - release);
        gain2.gain.linearRampToValueAtTime(0, startTime + duration);
        osc2.connect(gain2);
        gain2.connect(musicCtx.destination);
        osc2.start(startTime);
        osc2.stop(startTime + duration);
      }

      /**
       * 从指定位置恢复背景音乐
       */
      function resumeMusic(startIdx, timeOffset) {
        if (musicStarted) return;
        musicStarted = true;

        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          musicCtx = new AC();
        } catch (e) { return; }

        startIdx = startIdx || 0;
        timeOffset = timeOffset || 0;

        function scheduleLoop(fromIdx, offset) {
          if (!musicCtx) return;
          var now = musicCtx.currentTime;
          var cursorTime = now - offset;

          for (var i = 0; i < melodySequence.length; i++) {
            musicNoteIdx = (fromIdx + i) % melodySequence.length;
            var note = melodySequence[musicNoteIdx];
            var noteStart;

            if (i === 0) {
              noteStart = now;
              var remaining = note.dur - offset;
              if (remaining > 0.05) {
                playMusicNote(note.freq, note.harm, noteStart, remaining);
              }
              cursorTime = now + remaining;
            } else {
              noteStart = cursorTime;
              playMusicNote(note.freq, note.harm, noteStart, note.dur);
              cursorTime += note.dur;
            }
          }

          var timeUntilNextLoop = (cursorTime - musicCtx.currentTime) * 1000;
          if (timeUntilNextLoop < 50) timeUntilNextLoop = 50;

          musicTimer = setTimeout(function () {
            scheduleLoop(0, 0);
          }, timeUntilNextLoop - 30);
        }

        scheduleLoop(startIdx, timeOffset);
      }

      // ==================== 像素方块流动背景 ====================

      var squareColors = [
        'rgba(255,209,220,0.25)',
        'rgba(232,213,224,0.25)',
        'rgba(212,229,247,0.22)',
        'rgba(212,237,218,0.22)',
        'rgba(255,245,238,0.28)',
        'rgba(200,184,212,0.22)',
        'rgba(245,215,210,0.25)',
      ];

      var squares = [];
      var SQUARE_COUNT = 45;

      function initSquares() {
        squares = [];
        for (var i = 0; i < SQUARE_COUNT; i++) {
          squares.push({
            x: Math.random() * (bgCanvas.width || window.innerWidth),
            y: Math.random() * (bgCanvas.height || window.innerHeight),
            size: 6 + Math.random() * 10,
            speed: 0.12 + Math.random() * 0.35,
            color: squareColors[Math.floor(Math.random() * squareColors.length)],
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.003 + Math.random() * 0.005,
            wobbleAmp: 0.3 + Math.random() * 0.7,
          });
        }
      }

      function resizeCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      }

      function drawBgFrame() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        squares.forEach(function (sq) {
          sq.y -= sq.speed;
          sq.wobble += sq.wobbleSpeed;
          var driftX = Math.sin(sq.wobble) * sq.wobbleAmp;
          var drawX = sq.x + driftX;
          if (sq.y < -sq.size) {
            sq.y = bgCanvas.height + sq.size;
            sq.x = Math.random() * bgCanvas.width;
          }
          bgCtx.fillStyle = sq.color;
          bgCtx.fillRect(Math.floor(drawX), Math.floor(sq.y), Math.floor(sq.size), Math.floor(sq.size));
        });
        requestAnimationFrame(drawBgFrame);
      }

      // ==================== 留言 API ====================

      /** 构建 API URL */
      function apiUrl(path) {
        if (!API_BASE_URL) {
          // 未配置接口地址时的本地模拟数据
          return null;
        }
        return API_BASE_URL.replace(/\/+$/, '') + path;
      }

      /** 获取留言列表 */
      function fetchMessages() {
        var url = apiUrl('/api/messages');

        if (!url) {
          // 接口未配置：展示提示
          messageWall.innerHTML =
            '<div class="msg-empty">' +
            '✨ 接口地址未配置 ✨<br><br>' +
            '<span style="font-size:12px;color:#C9B8D4;">' +
            '请先在代码中修改 <b>API_BASE_URL</b> 为你的<br>' +
            'Cloudflare Pages 域名，然后刷新页面。<br>' +
            '详见 deploy-cf-pages.md 部署文档。</span>' +
            '</div>';
          return;
        }

        messageWall.innerHTML = '<div class="msg-loading">loading messages...</div>';

        fetch(url)
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.success && data.messages) {
              renderMessages(data.messages);
            } else {
              messageWall.innerHTML = '<div class="msg-empty">暂无留言，来写下第一句吧 💌</div>';
            }
          })
          .catch(function () {
            messageWall.innerHTML =
              '<div class="msg-empty" style="color:#C98B8B;">加载失败，请检查网络或接口地址</div>';
          });
      }

      /** 发送留言 */
      function sendMessage(content) {
        if (isSending) return;
        var url = apiUrl('/api/messages');

        if (!url) {
          setStatus('请先配置 API_BASE_URL 接口地址', 'error');
          return;
        }

        isSending = true;
        btnSend.disabled = true;
        setStatus('发送中…', '');

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: content }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            isSending = false;
            btnSend.disabled = false;

            if (data.success) {
              setStatus('发送成功 💌', 'success');
              playSuccessSound();
              msgInput.value = '';
              // 重新加载留言列表
              fetchMessages();
              // 3 秒后清除状态文字
              setTimeout(function () { setStatus('', ''); }, 3000);
            } else {
              setStatus(data.error || '发送失败，请重试', 'error');
            }
          })
          .catch(function () {
            isSending = false;
            btnSend.disabled = false;
            setStatus('网络错误，请检查接口地址', 'error');
          });
      }

      /** 设置发送状态文字 */
      function setStatus(msg, type) {
        sendStatus.textContent = msg;
        sendStatus.className = 'send-status ' + (type || '');
      }

      /** 格式化时间为可读字符串 */
      function formatTime(timestamp) {
        var d = new Date(timestamp);
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        return (
          d.getFullYear() + '-' +
          pad(d.getMonth() + 1) + '-' +
          pad(d.getDate()) + ' ' +
          pad(d.getHours()) + ':' +
          pad(d.getMinutes()) + ':' +
          pad(d.getSeconds())
        );
      }

      /** 渲染留言墙 */
      function renderMessages(messages) {
        if (!messages || messages.length === 0) {
          messageWall.innerHTML = '<div class="msg-empty">暂无留言，来写下第一句吧 💌</div>';
          return;
        }

        var html = '';
        messages.forEach(function (msg) {
          html +=
            '<div class="msg-card">' +
            '<div class="msg-time">' + formatTime(msg.timestamp) + '</div>' +
            '<div class="msg-body">' + escapeHtml(msg.content) + '</div>' +
            '</div>';
        });
        messageWall.innerHTML = html;
      }

      /** 简单 HTML 转义，防 XSS */
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // ==================== 页面初始化 ====================

      function init() {
        // 初始化背景
        resizeCanvas();
        initSquares();
        drawBgFrame();

        window.addEventListener('resize', function () {
          resizeCanvas();
          initSquares();
        });

        // 尝试恢复背景音乐（从 sessionStorage 读取上一页保存的状态）
        if (sessionStorage.getItem('px_music_active') === '1') {
          var savedIdx = parseInt(sessionStorage.getItem('px_music_noteIdx')) || 0;
          resumeMusic(savedIdx, 0);
        }

        // 首次交互时尝试启动音乐（处理自动播放限制）
        document.addEventListener('click', function tryMusic() {
          if (!musicStarted && sessionStorage.getItem('px_music_active') === '1') {
            var idx = parseInt(sessionStorage.getItem('px_music_noteIdx')) || 0;
            resumeMusic(idx, 0);
          }
        }, { once: false });

        // 按钮事件
        btnSend.addEventListener('mouseenter', playHoverSound);
        btnSend.addEventListener('click', function () {
          playClickSound();
          var content = msgInput.value.trim();
          if (!content) {
            setStatus('请写下你想说的话', 'error');
            return;
          }
          sendMessage(content);
        });

        // 回车发送
        msgInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            btnSend.click();
          }
        });

        // 加载留言列表
        fetchMessages();
      }

      init();
    })();
  </script>
</body>
</html>
